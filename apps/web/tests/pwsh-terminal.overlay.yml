# The pwsh terminal-card lane swaps the shipped bash stack for the PowerShell
# twin. The base patch already declares both shell stacks — `bash-sandbox` /
# `tool-bash` (disabled on win32) and `pwsh-sandbox` / `tool-pwsh` (disabled off
# win32) — so this overlay PATCHES those existing rows instead of inserting new
# ones. Inserting another `tool-pwsh` row duplicated the loader entry id, and an
# extra executor row would double-register the `bash` service. Disable the bash
# executor + tool and enable the pwsh executor + tool; the permission service is
# disabled because an unconfined pwsh executor is refused by design and this lane
# only replays a seeded session.
- id: bash-sandbox
  disabled: true
- id: pwsh-sandbox
  disabled: false
- id: tool-bash
  disabled: true
- id: tool-pwsh
  disabled: false
- id: permission
  disabled: true
