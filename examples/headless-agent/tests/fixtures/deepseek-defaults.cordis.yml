- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ../../cordis.yml
    patches:
      - id: llm-deepseek
        config:
          baseURL: !!js process.env.DSH_SNAPSHOT_BASE_URL
          thinking: disabled
          # Wide enough that CI scheduling jitter in the mock's first byte cannot
          # trip the idle watchdog, yet far below the mock's no-comment data delay
          # (see deepseekDefaultsServer) so a regression that stopped resetting the
          # idle timer on SSE comments would still time out.
          streamIdleTimeoutMs: 500
      - id: agent-spine
        config:
          agents:
            - id: main
              provider: deepseek-official
              model: deepseek-v4-flash
              cwd: !!js process.cwd()
          workspaceContext: false
          persona: 'Keyless DeepSeek adapter defaults snapshot.'
      - id: persistence
        config:
          root: './.sessions'
