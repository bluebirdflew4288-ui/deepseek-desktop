name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  verify-release-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Require the exact version on main history
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          node -e "const fs=require('node:fs'); const version=JSON.parse(fs.readFileSync('apps/desktop/package.json','utf8')).version; if (process.env.RELEASE_TAG !== 'v'+version) throw new Error('release tag must exactly match desktop version '+version);"
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main || { echo 'Release tag commit is not in origin/main history.'; exit 1; }

  build:
    name: Build ${{ matrix.name }}
    needs: verify-release-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            platform: mac
            architecture: arm64
            targets: dmg zip
            artifact: desktop-macos-arm64
            paths: |
              apps/desktop/dist/DeepSeek-Desktop-*-mac-arm64.dmg
              apps/desktop/dist/DeepSeek-Desktop-*-mac-arm64.zip
              apps/desktop/release-manifest.json
            builder_options: --config.mac.notarize=false --config.mac.hardenedRuntime=false
          - name: Windows x64
            runner: windows-2022
            platform: win
            architecture: x64
            targets: nsis zip
            artifact: desktop-windows-x64
            paths: |
              apps/desktop/dist/DeepSeek-Desktop-*-win-x64.exe
              apps/desktop/dist/DeepSeek-Desktop-*-win-x64.zip
              apps/desktop/release-manifest.json
              apps/desktop/windows-signing-manifest.json

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron runtime
        working-directory: apps/desktop
        run: pnpm exec electron --version

      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: node -e "const expected=process.env.EXPECTED_ARCHITECTURE; if (process.arch!==expected) throw new Error('runner architecture '+process.arch+' does not match '+expected); console.log('runner architecture '+process.arch);"

      - name: Build repository
        run: pnpm run build

      - name: Stage managed npm runtime
        run: node --import tsx apps/desktop/scripts/stage-npm.ts

      - name: Build macOS distributables
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac ${{ matrix.targets }} --${{ matrix.architecture }} --publish never ${{ matrix.builder_options }}

      - name: Write macOS artifact manifest
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --import tsx scripts/release-assets.ts write-platform-manifest --platform mac-arm64 --tag "$RELEASE_TAG" --dist dist --output release-manifest.json

      - name: Build and verify Windows x64 distributables (signed or unsigned)
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_EXPECTED_PUBLISHER: ${{ vars.WINDOWS_EXPECTED_PUBLISHER }}
          WINDOWS_RFC3161_TIMESTAMP_SERVER: ${{ vars.WINDOWS_RFC3161_TIMESTAMP_SERVER }}
        run: node --import tsx scripts/windows-release-build.ts

      - name: Write Windows x64 artifact manifest
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node --import tsx scripts/release-assets.ts write-platform-manifest --platform win-x64 --tag "$env:RELEASE_TAG" --dist dist --output release-manifest.json

      - name: Upload verified platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft, verify, and publish GitHub Release
    needs: [verify-release-tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes and manifest verifier
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install release-script dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: release-assets/mac

      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: release-assets/win

      - name: Create draft, reconcile immutable assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --import tsx apps/desktop/scripts/release-assets.ts sync --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --artifacts-root release-assets --notes-template .github/release-notes/desktop.md
