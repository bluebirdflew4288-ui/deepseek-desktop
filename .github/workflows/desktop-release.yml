name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  verify-release-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve-release-tag.outputs.release_tag }}
      release_commit: ${{ steps.resolve-release-tag.outputs.release_commit }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve and verify the immutable release tag
        id: resolve-release-tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin --tags --no-recurse-submodules
          test -n "$RELEASE_TAG"
          RELEASE_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          TAG_VERSION="$(git show "$RELEASE_TAG:apps/desktop/package.json" | node -e "const fs=require('node:fs'); process.stdout.write(JSON.parse(fs.readFileSync(0,'utf8')).version)")"
          if [[ "$RELEASE_TAG" != "v$TAG_VERSION" ]]; then
            echo "release tag must exactly match desktop version $TAG_VERSION"
            exit 1
          fi
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main || { echo 'Release tag commit is not in origin/main history.'; exit 1; }
          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_commit=$RELEASE_COMMIT"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build macOS arm64
    needs: verify-release-tag
    runs-on: macos-14
    steps:
      - name: Check out release source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-release-tag.outputs.release_tag }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Materialize the pinned Electron distribution
        run: pnpm --filter @deepseek-ai/dsh-desktop run materialize:electron

      - name: Verify installed Electron matches the Desktop runtime pin
        run: node --import tsx apps/desktop/scripts/verify-electron-runtime.ts apps/desktop/node_modules/electron/dist/Electron.app/Contents/MacOS/Electron

      - name: Verify runner architecture
        run: node -e "if (process.arch!=='arm64') throw new Error('Expected arm64 runner'); console.log('runner architecture '+process.arch);"

      - name: Build repository
        run: pnpm run build

      - name: Stage managed npm runtime
        run: node --import tsx apps/desktop/scripts/stage-npm.ts

      - name: Build macOS distributables
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac dmg zip --arm64 --publish never --config.mac.notarize=false --config.mac.hardenedRuntime=false

      - name: Verify packaged Electron matches the Desktop runtime pin
        working-directory: apps/desktop
        run: node --import tsx scripts/verify-electron-runtime.ts "dist/mac-arm64/DeepSeek Desktop.app/Contents/MacOS/DeepSeek Desktop"

      - name: Verify macOS DMG contents and app identity
        working-directory: apps/desktop
        run: node --import tsx scripts/verify-mac-dmg.ts dist/DeepSeek-Desktop-*-mac-arm64.dmg

      - name: Write macOS artifact manifest
        working-directory: apps/desktop
        env:
          RELEASE_TAG: ${{ needs.verify-release-tag.outputs.release_tag }}
        run: node --import tsx scripts/release-assets.ts write-platform-manifest --platform mac-arm64 --tag "$RELEASE_TAG" --dist dist --output release-manifest.json

      - name: Upload verified macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            apps/desktop/dist/DeepSeek-Desktop-*-mac-arm64.dmg
            apps/desktop/dist/DeepSeek-Desktop-*-mac-arm64.zip
            apps/desktop/release-manifest.json
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft, verify, and publish GitHub Release
    needs: [verify-release-tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes and manifest verifier
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-release-tag.outputs.release_tag }}
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install release-script dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: release-assets/mac

      - name: Create draft, reconcile immutable assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release-tag.outputs.release_tag }}
          APPLICATION_SOURCE_COMMIT: ${{ needs.verify-release-tag.outputs.release_commit }}
          RELEASE_TOOLING_COMMIT: ${{ needs.verify-release-tag.outputs.release_commit }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --import tsx apps/desktop/scripts/release-assets.ts sync --platforms mac-arm64 --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --artifacts-root release-assets --notes-template .github/release-notes/desktop.md --application-source-commit "$APPLICATION_SOURCE_COMMIT" --release-tooling-commit "$RELEASE_TOOLING_COMMIT"
