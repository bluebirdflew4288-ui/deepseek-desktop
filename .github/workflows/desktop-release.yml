name: Desktop Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing immutable release tag to recover'
        required: true
        default: v1.0.5
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '24'

jobs:
  verify-release-tag:
    name: Verify release tag
    runs-on: ubuntu-24.04
    outputs:
      release_tag: ${{ steps.resolve-release-tag.outputs.release_tag }}
      release_commit: ${{ steps.resolve-release-tag.outputs.release_commit }}
      release_tooling_commit: ${{ steps.resolve-release-tag.outputs.release_tooling_commit }}
    steps:
      - name: Check out complete history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve and verify the immutable release tag
        id: resolve-release-tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          git fetch origin --tags --no-recurse-submodules
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            git fetch origin main --no-recurse-submodules
          fi
          test -n "$RELEASE_TAG"
          RELEASE_COMMIT="$(git rev-parse "$RELEASE_TAG^{commit}")"
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TOOLING_COMMIT="$(git rev-parse origin/main^{commit})"
          else
            RELEASE_TOOLING_COMMIT="$RELEASE_COMMIT"
          fi
          TAG_VERSION="$(git show "$RELEASE_TAG:apps/desktop/package.json" | node -e "const fs=require('node:fs'); process.stdout.write(JSON.parse(fs.readFileSync(0,'utf8')).version)")"
          if [[ "$RELEASE_TAG" != "v$TAG_VERSION" ]]; then
            echo "release tag must exactly match desktop version $TAG_VERSION"
            exit 1
          fi
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$RELEASE_TAG:$RELEASE_COMMIT" in
              v1.0.5:8cdad7930310893150976929758b29975877fb28|v1.0.6:77d310dbdd82cf20110ccbbc790e77ed4d5f6d01)
                ;;
              *)
                echo 'workflow_dispatch recovery is restricted to explicitly allowlisted immutable release tags and commits.'
                exit 1
                ;;
            esac
          fi
          git merge-base --is-ancestor "$RELEASE_COMMIT" origin/main || { echo 'Release tag commit is not in origin/main history.'; exit 1; }
          {
            echo "release_tag=$RELEASE_TAG"
            echo "release_commit=$RELEASE_COMMIT"
            echo "release_tooling_commit=$RELEASE_TOOLING_COMMIT"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.name }}
    needs: verify-release-tag
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runner: macos-14
            platform: mac
            architecture: arm64
            targets: dmg zip
            artifact: desktop-macos-arm64
            paths: |
              apps/desktop/dist/DeepSeek-Desktop-*-mac-arm64.dmg
              apps/desktop/dist/DeepSeek-Desktop-*-mac-arm64.zip
              apps/desktop/release-manifest.json
            builder_options: --config.mac.notarize=false --config.mac.hardenedRuntime=false
          - name: Windows x64
            runner: windows-2022
            platform: win
            architecture: x64
            targets: nsis zip
            artifact: desktop-windows-x64
            paths: |
              apps/desktop/dist/DeepSeek-Desktop-*-win-x64.exe
              apps/desktop/dist/DeepSeek-Desktop-*-win-x64.zip
              apps/desktop/release-manifest.json
              apps/desktop/windows-signing-manifest.json

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-release-tag.outputs.release_tag }}
          fetch-depth: 1
          persist-credentials: false

      - name: Overlay recovery release tooling from public main
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- apps/desktop/scripts/windows-release-build.ts apps/desktop/scripts/verify-windows-authenticode.ps1

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Ensure Electron runtime
        working-directory: apps/desktop
        run: pnpm exec electron --version

      - name: Verify runner architecture
        env:
          EXPECTED_ARCHITECTURE: ${{ matrix.architecture }}
        run: node -e "const expected=process.env.EXPECTED_ARCHITECTURE; if (process.arch!==expected) throw new Error('runner architecture '+process.arch+' does not match '+expected); console.log('runner architecture '+process.arch);"

      - name: Build repository
        run: pnpm run build

      - name: Stage managed npm runtime
        run: node --import tsx apps/desktop/scripts/stage-npm.ts

      - name: Build macOS distributables
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: pnpm exec electron-builder --mac ${{ matrix.targets }} --${{ matrix.architecture }} --publish never ${{ matrix.builder_options }}

      - name: Verify macOS DMG contents and app identity
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        run: node --import tsx scripts/verify-mac-dmg.ts dist/DeepSeek-Desktop-*-mac-arm64.dmg

      - name: Write macOS artifact manifest
        if: matrix.platform == 'mac'
        working-directory: apps/desktop
        env:
          RELEASE_TAG: ${{ needs.verify-release-tag.outputs.release_tag }}
        run: node --import tsx scripts/release-assets.ts write-platform-manifest --platform mac-arm64 --tag "$RELEASE_TAG" --dist dist --output release-manifest.json

      - name: Build and verify Windows x64 distributables (signed or unsigned)
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          WINDOWS_EXPECTED_PUBLISHER: ${{ vars.WINDOWS_EXPECTED_PUBLISHER }}
          WINDOWS_RFC3161_TIMESTAMP_SERVER: ${{ vars.WINDOWS_RFC3161_TIMESTAMP_SERVER }}
        run: node --import tsx scripts/windows-release-build.ts

      - name: Verify Windows signing manifest before upload
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        shell: pwsh
        run: |
          $manifest = Get-Content -LiteralPath windows-signing-manifest.json -Raw | ConvertFrom-Json
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          if ($manifest.schemaVersion -ne 1 -or $manifest.platform -ne 'win-x64' -or $manifest.version -ne $version) { throw 'Windows signing manifest identity is invalid' }
          if ($manifest.mode -eq 'unsigned' -and $manifest.authenticode -ne 'NotSigned') { throw 'Unsigned Windows signing manifest is not NotSigned' }
          if ($manifest.mode -eq 'signed' -and $manifest.authenticode -ne 'Valid') { throw 'Signed Windows signing manifest is not Valid' }
          if ($manifest.mode -notin @('signed', 'unsigned')) { throw 'Windows signing manifest mode is invalid' }

      - name: Write Windows x64 artifact manifest
        if: matrix.platform == 'win'
        working-directory: apps/desktop
        env:
          RELEASE_TAG: ${{ needs.verify-release-tag.outputs.release_tag }}
        run: node --import tsx scripts/release-assets.ts write-platform-manifest --platform win-x64 --tag "$env:RELEASE_TAG" --dist dist --output release-manifest.json

      - name: Upload verified platform artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.paths }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft, verify, and publish GitHub Release
    needs: [verify-release-tag, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Check out release notes and manifest verifier
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.verify-release-tag.outputs.release_tag }}
          persist-credentials: false

      - name: Overlay recovery release tooling from public main
        if: github.event_name == 'workflow_dispatch'
        run: |
          git fetch origin main --depth=1
          git checkout origin/main -- apps/desktop/scripts/release-assets.ts .github/release-notes/desktop.md

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Install release-script dependencies
        run: pnpm install --frozen-lockfile

      - name: Download macOS artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: release-assets/mac

      - name: Download Windows x64 artifacts
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: release-assets/win

      - name: Create draft, reconcile immutable assets, and publish
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify-release-tag.outputs.release_tag }}
          APPLICATION_SOURCE_COMMIT: ${{ needs.verify-release-tag.outputs.release_commit }}
          RELEASE_TOOLING_COMMIT: ${{ needs.verify-release-tag.outputs.release_tooling_commit }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node --import tsx apps/desktop/scripts/release-assets.ts sync --tag "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --artifacts-root release-assets --notes-template .github/release-notes/desktop.md --application-source-commit "$APPLICATION_SOURCE_COMMIT" --release-tooling-commit "$RELEASE_TOOLING_COMMIT"
